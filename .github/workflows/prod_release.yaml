name: Versioning and Releasing

on:
  push:
    branches:
      - main
      - helm

jobs:
  version:
    runs-on: ubuntu-latest
    
    outputs:
      src_version: ${{ steps.get-kubsleeper-version.outputs.src_version }}
      helm_version: ${{ steps.get-helm-version.outputs.helm_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: |
          wget https://github.com/eloi-menaud/c14/releases/download/v4.0.0/c14
          chmod +x c14
      
      - name: Get kubesleeper version
        id: get-kubsleeper-version
        run: |
          echo "get new source version"
          rsc_folders="src Cargo.toml Dockerfile"
          base_commit=$(git rev-list -n 1 $GITHUB_REF~1 -- $rsc_folders)
          base_version=$(cat Cargo.toml | grep -o '^version\s*=.*$' | cut -d "=" -f 2 | sed "s|[\"']||g")
          version=$(./c14 version --strict --base-version $base_version --from $base_commit --target $rsc_folders)
          echo "src_version=$version" >> $GITHUB_OUTPUT
        
      - name: Get helm version
        id: get-helm-version
        run: |
          echo "get new helm version"
          rsc_folders="helm"
          base_commit=$(git rev-list -n 1 $GITHUB_REF~1 -- $rsc_folders)
          base_version=$(cat helm/kubesleeper/Chart.yaml | grep -o '^version\s*:.*$' | cut -d ":" -f 2 | sed "s|[\"']||g")
          version=$(./c14 version --strict --base-version $base_version --from $base_commit --target $rsc_folders)
          echo "helm_version=$version" >> $GITHUB_OUTPUT


  build-kubesleeper:
    needs: version
    runs-on: ubuntu-latest
    if: ${{ needs.version.outputs.src_version != '' }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Overwrite Cargo.toml version
        run: |
          version="${{ needs.version.outputs.src_version }}"
          echo "Overwriting Cargo.toml with version: $version"
          sed -i "s/^version\s*=.*$/version = \"${version}\"/" Cargo.toml
          git -c color.ui=always diff Cargo.toml

      - name: Build kubesleeper binary
        run: |
          docker build --target binary-export --output type=local,dest=./dist .
    
      - name: Upload Artifact (Cargo.toml, kubesleeper binary)
        uses: actions/upload-artifact@v4
        with:
          name: built-products
          path: |
            dist/kubesleeper
            Cargo.toml
          retention-days: 1

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          target: image
          context: ./
          push: true
          tags: |
            ghcr.io/kubesleeper/kubesleeper:latest
            ghcr.io/kubesleeper/kubesleeper:${{ needs.version.outputs.src_version }}


  build-helm:
    needs: version
    runs-on: ubuntu-latest
    if: ${{ needs.version.outputs.helm_version != '' || needs.version.outputs.src_version != '' }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Overwrite Chart.yaml version
        run: |
          helm_version="${{ needs.version.outputs.helm_version }}"
          echo "Overwriting Chart.yaml with version: $helm_version"
          sed -i "s/^version\s*:.*$/version: \"${helm_version}\"/" helm/kubesleeper/Chart.yaml
          
          src_version="${{ needs.version.outputs.src_version }}"
          echo "Overwriting Chart.yaml with appVersion: $src_version"
          sed -i "s/^appVersion\s*:.*$/appVersion: \"${src_version}\"/" helm/kubesleeper/Chart.yaml
          git -c color.ui=always diff helm/kubesleeper/Chart.yaml
        
      - name: Build helm release
        run: |
            helm package ./helm/kubesleeper
          
          
